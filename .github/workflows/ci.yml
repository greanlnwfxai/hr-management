name: HR Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── API — Build & Validate ──────────────────────────────────────────────────
  # Installs NestJS dependencies, generates Prisma client, validates schema,
  # and compiles TypeScript via nest build.
  # No real database connection is required — prisma validate is schema-only.
  api-ci:
    name: API — Build & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    env:
      # Safe CI placeholder — prisma validate and nest build do not connect to DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_management?schema=public
      JWT_SECRET: ci_test_secret_do_not_use_in_production
      CORS_ORIGIN: http://localhost:3002
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
      LOGIN_THROTTLE_TTL: "60"
      LOGIN_THROTTLE_LIMIT: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client from schema — required before TypeScript compilation
      # because the compiled NestJS code imports @prisma/client types.
      - name: Generate Prisma client
        run: npx prisma generate

      # Validates the Prisma schema file syntax. Does not require a live database.
      - name: Validate Prisma schema
        run: npx prisma validate

      # Unit tests mock PrismaService and JwtService — no database connection needed.
      # JWT_SECRET must be set so JwtStrategy can instantiate without throwing.
      - name: Run unit tests
        run: npm test

      - name: Build API (nest build)
        run: npm run build

  # ── Web — Build & Validate ──────────────────────────────────────────────────
  # Installs Next.js dependencies and runs a full production build.
  # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time (T-032 fix).
  # A safe placeholder URL is sufficient to validate the build.
  web-ci:
    name: Web — Build & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4002
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web (next build)
        run: npm run build

  # ── Mobile — Typecheck & Export ────────────────────────────────────────────
  # Installs Expo/React Native dependencies, runs TypeScript typecheck, and
  # produces a static Expo web export to validate the bundle compiles cleanly.
  # No real device, GPS permission, API, or secrets are required.
  # Install note: plain `npm ci` from the lockfile succeeds — no --legacy-peer-deps
  # needed in CI because the lockfile resolves peer deps at install time.
  mobile-ci:
    name: Mobile — Typecheck & Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Export web build (Expo)
        run: npx expo export --platform web

  # ── Compose — Config Validation ─────────────────────────────────────────────
  # Validates both compose files render correctly and that the production
  # standalone compose has no host-bound port mappings.
  # Does NOT start Docker containers or build images.
  compose-ci:
    name: Compose — Config Validation
    runs-on: ubuntu-latest

    env:
      # Safe CI placeholders — required by docker-compose.production.yml :? validation.
      # These values are intentionally non-secret placeholder strings.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_postgres_password
      POSTGRES_DB: hr_management
      DATABASE_URL: postgresql://postgres:ci_postgres_password@db:5432/hr_management?schema=public
      JWT_SECRET: ci_jwt_secret_do_not_use_in_production
      CORS_ORIGIN: https://hr.example.com
      NEXT_PUBLIC_API_URL: https://hr.example.com/api
      PUBLIC_APP_URL: https://hr.example.com
      TRUST_PROXY: "true"
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
      LOGIN_THROTTLE_TTL: "60"
      LOGIN_THROTTLE_LIMIT: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate dev compose config (docker-compose.yml)
        run: docker compose -f docker-compose.yml config

      - name: Validate production standalone compose config (docker-compose.production.yml)
        run: docker compose -f docker-compose.production.yml config

      # Confirm the production compose has no host-bound port mappings.
      # The `published:` field only appears in the rendered config when a host
      # port binding exists (ports: "HOST:CONTAINER"). expose: never produces it.
      - name: Confirm no host-bound ports in production compose
        run: |
          CONFIG="$(docker compose -f docker-compose.production.yml config)"
          if echo "$CONFIG" | grep -q "published:"; then
            echo "FAIL: production compose has host-bound port mappings:"
            echo "$CONFIG" | grep -B 4 "published:" || true
            exit 1
          fi
          echo "PASS: no host-bound port mappings in docker-compose.production.yml"

  # ── Integration — Runtime API Test ─────────────────────────────────────────
  # Starts a real PostgreSQL service, runs Prisma migrations, seeds the admin
  # user, starts the compiled NestJS API, then executes the authenticated
  # smoke test against it.  Runs after api-ci to ensure the build passes first.
  integration-ci:
    name: Integration — Runtime API Test
    runs-on: ubuntu-latest
    needs: api-ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_management_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hr_management_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_management_ci?schema=public
      JWT_SECRET: ci_jwt_secret_do_not_use_in_production
      CORS_ORIGIN: http://localhost:3002
      PORT: "4002"
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
      LOGIN_THROTTLE_TTL: "60"
      # Higher than production default — prevents accidental throttle failures
      # from the smoke test's single login call plus retry headroom.
      LOGIN_THROTTLE_LIMIT: "10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run Prisma migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Seed database (admin user)
        working-directory: apps/api
        run: npx prisma db seed

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Start API in background
        working-directory: apps/api
        run: npm run start:prod &

      - name: Wait for API health endpoint
        run: |
          curl -f --retry 20 --retry-delay 2 --retry-all-errors \
            --max-time 5 http://localhost:4002/health

      - name: Run API smoke test
        run: ./scripts/api-smoke-test.sh
        env:
          API_URL: http://localhost:4002

  # ── Security — Audit & Secret Scan ──────────────────────────────────────────
  # Installs dependencies for each workspace, then runs the combined security
  # harness. The job is blocking: unknown HIGH/CRITICAL advisories or likely
  # committed secrets fail the workflow.
  security-ci:
    name: Security — Audit & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/mobile/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run security review
        run: ./scripts/security-review.sh

  # ── E2E — Playwright Critical Flows ─────────────────────────────────────────
  # Starts the real Docker stack (db → migrate/seed → api → web), then runs all
  # 44 Playwright tests in Chromium. Depends on build jobs but NOT on
  # integration-ci — they validate different runtime paths in parallel.
  #
  # Migration strategy: the API Docker image (runner stage) does not include
  # prisma/ migration files, so migrations run from the host runner against the
  # db container's exposed port (localhost:5432) before the API container starts.
  e2e-ci:
    name: E2E — Playwright Critical Flows
    runs-on: ubuntu-latest
    needs: [api-ci, web-ci, compose-ci]

    env:
      # ── Docker Compose / API ───────────────────────────────────────────────
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_management
      # Container-internal URL used by the api service via the Docker network.
      # Host-side migration steps override this to localhost:5432 (see below).
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hr_management?schema=public
      JWT_SECRET: ci_jwt_secret_do_not_use_in_production
      CORS_ORIGIN: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:4002
      PORT: "4002"
      TRUST_PROXY: "false"
      THROTTLE_TTL: "60"
      THROTTLE_LIMIT: "100"
      LOGIN_THROTTLE_TTL: "60"
      # Raised from the production default (5) to absorb Playwright globalSetup
      # token fetch + login.spec.ts UI login calls without hitting the rate limiter.
      LOGIN_THROTTLE_LIMIT: "20"
      SWAGGER_ENABLED: "true"
      SWAGGER_PATH: docs
      # ── Playwright ─────────────────────────────────────────────────────────
      E2E_BASE_URL: http://localhost:3002
      E2E_API_URL: http://localhost:4002
      E2E_ADMIN_EMAIL: admin@hr.local
      E2E_ADMIN_PASSWORD: admin1234
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Cache both lockfiles so web install and api install share the cache key.
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/api/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      # Install Chromium system dependencies and the browser binary.
      # --with-deps installs OS-level packages required on ubuntu-latest.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # API deps are needed to run prisma migrate deploy and prisma db seed
      # from the host runner (the API Docker image has no migration files).
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      # Start the database container first, before the API, so we can apply
      # migrations from the host before any application code connects.
      - name: Start database service
        run: docker compose up -d db

      - name: Wait for database to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres -d hr_management >/dev/null 2>&1; then
              echo "Database ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: database did not become ready within 90 seconds"
              docker compose logs db
              exit 1
            fi
            echo "  attempt ${i}/30 — retrying in 3 s..."
            sleep 3
          done

      # Run migrations against localhost:5432 (the db container's host-exposed
      # port). The API container uses db:5432 (Docker-internal); both resolve
      # to the same database instance.
      - name: Run Prisma migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_management?schema=public

      - name: Seed database
        working-directory: apps/api
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hr_management?schema=public

      # Build images and start API + Web. The web service depends_on api healthy,
      # so Docker Compose starts web only after the API healthcheck passes.
      # NEXT_PUBLIC_API_URL is picked up from the job env and passed as a build
      # arg by docker-compose.yml, baking it into the Next.js bundle.
      - name: Build and start API and Web
        run: docker compose up -d --build api web

      - name: Wait for API health endpoint
        run: |
          curl -f --retry 30 --retry-delay 3 --retry-all-errors \
            --max-time 5 http://localhost:4002/health

      - name: Wait for Web app to be reachable
        run: |
          curl -f --retry 30 --retry-delay 3 --retry-all-errors \
            --max-time 5 http://localhost:3002

      - name: Run Playwright E2E tests
        working-directory: apps/web
        run: npm run test:e2e

      # Upload report and test results so failures can be diagnosed without
      # re-running the full CI pipeline locally.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      # Always clean up containers and volumes to keep the GitHub runner tidy.
      - name: Stop and remove Docker services
        if: always()
        run: docker compose down -v
