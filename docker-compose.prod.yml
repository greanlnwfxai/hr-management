# docker-compose.prod.yml — Production overlay (HISTORICAL — see note below)
#
# ⚠ RECOMMENDED ALTERNATIVE: use docker-compose.production.yml instead.
#   This overlay approach has a fundamental limitation: Docker Compose v2 merges
#   array-type fields (ports:), so ports: [] does NOT remove ports from the base
#   file. Ports 3002, 4002, and 5432 remain host-bound even with this overlay.
#   docker-compose.production.yml is a standalone file with no host port exposure.
#
# This file is kept for reference and may be useful for:
#   - Quick TRUST_PROXY / CORS override testing alongside docker-compose.yml
#   - CI/CD pipelines that already use the -f flag pattern
#
# Usage (if you choose this path over the standalone file):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ── PORT LIMITATION ───────────────────────────────────────────────────────────
#   Ports 3002, 4002, and 5432 will still be host-bound after merge.
#   Mitigate with a server firewall: block those ports externally,
#   allow only 80 and 443 publicly.
#
# Prerequisites:
#   - Firewall: only ports 80 and 443 open to the internet
#   - A reverse proxy (Caddy or Nginx) on the host routing to web:3002 and api:4002
#   - All required env vars set in the root .env file
#   - TLS termination handled by the reverse proxy

services:
  web:
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_APP_URL:-https://app.example.com}/api

  api:
    environment:
      TRUST_PROXY: "true"
